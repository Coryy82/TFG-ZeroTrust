<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Empresa S.L. — Portal corporativo{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f7fa; }
        .navbar-brand-mark { font-weight: 700; letter-spacing: .5px; }
        footer { background-color: #1f2937; color: #d1d5db; }
        footer a { color: #d1d5db; }
        .empresa-hero { background: linear-gradient(135deg, #1e3a8a 0%, #1f2937 100%); color: #fff; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
    <div class="container">
        <a class="navbar-brand navbar-brand-mark" href="/">EMPRESA S.L.</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link active" href="/">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/#equipo">Equipo</a></li>
                <li class="nav-item"><a class="nav-link" href="/#contacto">Contacto</a></li>
            </ul>
            <span class="navbar-text small text-secondary">Intranet corporativa</span>
        </div>
    </div>
</nav>

<main class="flex-grow-1">
    {% block content %}{% endblock %}
</main>

<footer class="py-4 mt-5">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center small">
        <div>
            &copy; 2026 Empresa S.L. &middot; Soluciones tecnológicas para el sector industrial.
        </div>
        <div class="text-md-end mt-2 mt-md-0">
            Portal v1.4.2 &mdash; Build 20260315
            <!-- TODO: ocultar el enlace al panel administrativo antes de pasar a produccion -->
            <a href="/admin" style="display:none" aria-hidden="true">admin</a>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
