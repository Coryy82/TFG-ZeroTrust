events {}
http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen 80;
        resolver 127.0.0.11 valid=30s;

        location / {
            proxy_pass http://webapp:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}