<ossec_config>
  <client>
    <server>
      <address>wazuh-manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- docker-listener: eventos exec/start/stop de todos los contenedores -->
  <wodle name="docker-listener">
    <interval>10m</interval>
    <attempts>5</attempts>
    <run_on_start>yes</run_on_start>
    <disabled>no</disabled>
  </wodle>

  <!-- FIM sobre certificados mTLS montados -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories check_all="yes" realtime="yes">/monitored/certs</directories>
  </syscheck>

  <!-- command monitoring: detectar nmap/curl en los procesos del host -->
  <localfile>
    <log_format>command</log_format>
    <command>ps auxww</command>
    <alias>process-list</alias>
    <frequency>15</frequency>
  </localfile>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>