<ossec_config>
  <client>
    <server>
      <address>wazuh-manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- docker-listener: ciclo de vida de contenedores (no post-RCE; el ataque es desde dentro) -->
  <wodle name="docker-listener">
    <interval>10m</interval>
    <attempts>5</attempts>
    <run_on_start>yes</run_on_start>
    <disabled>no</disabled>
  </wodle>

  <!-- FIM sobre certificados mTLS montados -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories check_all="yes" realtime="yes">/monitored/certs</directories>
  </syscheck>

  <!-- Post-RCE: procesos dentro de webapp (reverse shell) — fuente principal, 2s -->
  <localfile>
    <log_format>command</log_format>
    <command>bash /var/ossec/scripts/process-webapp.sh</command>
    <alias>process-webapp</alias>
    <frequency>2</frequency>
  </localfile>

  <!-- Respaldo host (pid:host); menos fiable para procesos efímeros en contenedor -->
  <localfile>
    <log_format>command</log_format>
    <command>ps auxww</command>
    <alias>process-list</alias>
    <frequency>5</frequency>
  </localfile>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
